security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email
        worker_provider:
            memory:
                users:
                    worker: { roles: ['ROLE_WORKER'] }

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        login:
            pattern: ^/api/login
            stateless: true
            provider: app_user_provider
            json_login:
                check_path: /api/login
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        # Machine-to-machine: Go workers (before the JWT api firewall).
        worker_api:
            pattern: ^/api/activities/\d+/(metrics|structure|features|summary)$
            stateless: true
            provider: worker_provider
            custom_authenticators:
                - App\Security\WorkerTokenAuthenticator

        # Browser JWT by default; WorkerTokenAuthenticator runs when X-Worker-Token is present
        # (e.g. GET /api/activities/{id} for idempotency checks).
        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            jwt: ~
            custom_authenticators:
                - App\Security\WorkerTokenAuthenticator

        main:
            lazy: true
            provider: app_user_provider

    access_control:
        - { path: ^/api/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/activities/\d+/(metrics|structure|features|summary)$, roles: ROLE_WORKER }
        - { path: ^/api,       roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
