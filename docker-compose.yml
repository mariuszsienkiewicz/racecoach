services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: racecoach
      POSTGRES_USER: racecoach
      POSTGRES_PASSWORD: racecoach
    ports:
      - "5432:5432"
    volumes:
      - database_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U racecoach -d racecoach"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:4
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: database
    depends_on:
      database:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: racecoach
      RABBITMQ_DEFAULT_PASS: racecoach
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: racecoach
      MINIO_ROOT_PASSWORD: racecoachsecret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "timeout 5s bash -c ':> /dev/tcp/127.0.0.1/9000' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 racecoach racecoachsecret
        mc mb --ignore-existing local/racecoach-fits
        mc anonymous set none local/racecoach-fits
        echo "MinIO bucket racecoach-fits is ready"

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      APP_ENV: dev
      APP_SECRET: change_me_racecoach_dev_secret_32chars
      DATABASE_URL: postgresql://racecoach:racecoach@database:5432/racecoach?serverVersion=16&charset=utf8
      MESSENGER_TRANSPORT_DSN: amqp://racecoach:racecoach@rabbitmq:5672/%2f/messages
      CORS_ALLOW_ORIGIN: '^https?://(localhost|127\\.0\\.0\\.1)(:[0-9]+)?$'
      JWT_SECRET_KEY: /app/config/jwt/private.pem
      JWT_PUBLIC_KEY: /app/config/jwt/public.pem
      JWT_PASSPHRASE: racecoach_dev_jwt
      POSTGRES_HOST: database
      POSTGRES_PORT: 5432
      POSTGRES_USER: racecoach
      DEMO_USER_EMAIL: coach@racecoach.local
      DEMO_USER_PASSWORD: coach123
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: racecoach
      S3_SECRET_KEY: racecoachsecret
      S3_BUCKET: racecoach-fits
      S3_USE_PATH_STYLE: "true"
      WORKER_API_TOKEN: dev-worker-token-change-me
      CHAT_SERVICE_TOKEN: dev-chat-service-token-change-me
      CHAT_SERVICE_BASE_URL: http://fit-chat:8081
    volumes:
      - ./backend:/app
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_PROXY: http://backend:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    depends_on:
      - backend
    
  fit-metrics:
    build:
      context: ./workers
    environment: &worker-env
      RABBITMQ_URL: amqp://racecoach:racecoach@rabbitmq:5672/
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: racecoach
      S3_SECRET_KEY: racecoachsecret
      S3_BUCKET: racecoach-fits
      S3_USE_PATH_STYLE: "true"
      API_BASE_URL: http://backend:8000
      WORKER_API_TOKEN: dev-worker-token-change-me
      CHAT_SERVICE_BASE_URL: http://fit-chat:8081
    depends_on: &worker-depends
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      backend:
        condition: service_started
    restart: unless-stopped

  fit-structure:
    build:
      context: ./workers
    command: ["/fit-structure"]
    environment: *worker-env
    depends_on: *worker-depends
    restart: unless-stopped

  fit-features:
    build:
      context: ./workers
    command: ["/fit-features"]
    environment: *worker-env
    depends_on: *worker-depends
    restart: unless-stopped

  fit-summary:
    build:
      context: ./workers
    command: ["/fit-summary"]
    environment:
      <<: *worker-env
      LLM_BASE_URL: http://host.docker.internal:11434/v1
      LLM_MODEL: llama3.1:8b
      LLM_API_KEY: ollama
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: *worker-depends
    restart: unless-stopped
  
  fit-chat:
    build:
      context: ./workers
    command: ["/fit-chat"]
    environment:
      <<: *worker-env
      LLM_BASE_URL: http://host.docker.internal:11434/v1
      LLM_MODEL: llama3.1:8b
      LLM_API_KEY: ollama
      CHAT_SERVICE_TOKEN: dev-chat-service-token-change-me
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: *worker-depends
    restart: unless-stopped

volumes:
  database_data:
  rabbitmq_data:
  minio_data:
  frontend_node_modules:
