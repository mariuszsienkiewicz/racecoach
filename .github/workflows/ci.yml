name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workers:
    name: Workers (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: workers/go.mod
          cache-dependency-path: workers/go.sum

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: |
          CGO_ENABLED=0 go build -o /tmp/fit-metrics ./cmd/fit-metrics
          CGO_ENABLED=0 go build -o /tmp/fit-structure ./cmd/fit-structure
          CGO_ENABLED=0 go build -o /tmp/fit-features ./cmd/fit-features
          CGO_ENABLED=0 go build -o /tmp/fit-summary ./cmd/fit-summary
          CGO_ENABLED=0 go build -o /tmp/fit-chat ./cmd/fit-chat

  backend:
    name: Backend (Symfony)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: intl, pdo_pgsql, zip, amqp
          coverage: none
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: |
            composer-

      - name: Prepare env
        run: cp .env.example .env

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: PHP CS Fixer
        run: composer cs-check

      - name: Warm cache for PHPStan
        run: php bin/console cache:warmup --env=dev --no-interaction

      - name: PHPStan
        run: composer phpstan

      - name: PHPUnit
        run: ./bin/phpunit

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
